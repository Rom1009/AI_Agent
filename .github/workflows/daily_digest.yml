name: Daily Digest Workflow 
on: 
  schedule:
    - cron: '0 0 * * *'
  push:
    branches:
      - main

jobs:
  run-agent:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Run Digest Agent
        env:
          MAIL_PASSWORD: ${{ secrets.MAIL_PASSWORD }} # Lấy từ GitHub Secrets
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }} # Lấy
          MAIL_SENDER: ${{ secrets.MAIL_SENDER }} # Lấy từ GitHub Secrets
          MAIL_RECEIVER: ${{ secrets.MAIL_RECEIVER }} # Lấy từ GitHub Secrets
        run: python -m src.ai.agents.run